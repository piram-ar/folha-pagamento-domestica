# Rotas comuns ao HTTP e ao HTTPS (incluído dentro do "server").
root /usr/share/nginx/html;
index index.html;

# Estáticos já vêm comprimidos do build (.gz); gzip dinâmico só para o JSON da API
gzip_static on;
gzip on;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml;

# Login e JSON são pequenos; recusa corpos grandes antes de chegar ao Python
client_max_body_size 1m;

# DNS interno do Docker, resolvido a cada requisição: o Nginx sobe mesmo
# que o backend ainda esteja iniciando após um boot do Raspberry Pi.
resolver 127.0.0.11 valid=10s ipv6=off;

location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sobrescreve (não acrescenta) o X-Forwarded-For: o cliente não consegue forjar o próprio IP e driblar
    # o limite de tentativas de login
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # Respostas da API (salários, CPFs) não ficam no cache do navegador
    add_header Cache-Control "no-store" always;
    include /etc/nginx/folha/cabecalhos.conf;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/folha/cabecalhos.conf;
}

# SPA: qualquer outra rota cai no index.html (React Router)
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/folha/cabecalhos.conf;
}
