# Cabeçalhos de segurança. Incluído em cada "location" que tem add_header próprio: no Nginx, um add_header
# dentro da location anula os herdados do server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Só arquivos do próprio Pi; sem scripts inline (o tema inicial fica em /tema-inicial.js).
# style-src 'unsafe-inline': o React aplica alguns estilos via atributo style.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
