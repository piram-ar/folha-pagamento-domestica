# Com certificado em /etc/nginx/certs: tudo por HTTPS; a porta 80 só redireciona.
server {
    listen 80;
    server_name _;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API_HTTP_LEGADO: o app Android antigo chama a API por http://. Este bloco some quando
    # API_HTTP_LEGADO=0 no .env (depois de atualizar o app para a versão com HTTPS).
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    # FIM_API_HTTP_LEGADO

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log off;

    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/folha/locais.conf;
}
