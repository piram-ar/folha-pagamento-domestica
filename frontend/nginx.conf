server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Estáticos já vêm comprimidos do build (.gz); gzip dinâmico só para o JSON da API
    gzip_static on;
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Menos escrita no cartão SD: só registra erros
    access_log off;

    # DNS interno do Docker, resolvido a cada requisição: o Nginx sobe mesmo
    # que o backend ainda esteja iniciando após um boot do Raspberry Pi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer outra rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
